<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دردشة الأصدقاء السرية</title>
    <style>
        :root { --main-color: #075e54; --bg-color: #ece5dd; }
        body { font-family: Arial, sans-serif; margin: 0; background: var(--bg-color); display: flex; flex-direction: column; height: 100vh; }
        
        /* شاشة الدخول واختيار الاسم */
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #075e54; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; gap: 15px; }
        .login-input { padding: 12px; border-radius: 20px; border: none; width: 250px; text-align: center; font-size: 1rem; outline: none; }
        .login-btn { background: #25d366; border: none; color: white; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-size: 1rem; font-weight: bold; }

        .header { background: var(--main-color); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .status-container { display: flex; align-items: center; gap: 10px; }
        .call-btn { background: #25d366; border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        
        /* قسيمة الأصدقاء */
        .friends-bar { background: #fff; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #ddd; overflow-x: auto; }
        .friend-tag { background: #e1f5fe; padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; cursor: pointer; border: 1px solid #b3e5fc; white-space: nowrap; }
        .add-friend-btn { background: #075e54; color: white; border: none; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }

        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 0.95rem; word-wrap: break-word; }
        .message.sent { background: #dcf8c6; align-self: flex-start; border-top-left-radius: 0; }
        .message.received { background: white; align-self: flex-end; border-top-right-radius: 0; }
        
        .sender-name { font-size: 0.75rem; color: #128c7e; font-weight: bold; margin-bottom: 3px; }
        .time { font-size: 0.7rem; color: #777; margin-top: 5px; text-align: left; }
        .typing-indicator { padding: 5px 20px; color: #555; font-style: italic; font-size: 0.85rem; min-height: 20px; }
        .footer { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; }
        .input-field { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        .send-btn { background: var(--main-color); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- شاشة الدخول واختيار اسم المستخدم المعرف الخاص بك -->
    <div class="login-screen" id="login-screen">
        <h2>🔒 اختر اسم المستخدم الخاص بك للدردشة الواردة</h2>
        <input type="text" id="username-input" class="login-input" placeholder="اكتب اسمك هنا...">
        <button class="login-btn" onclick="startApp()">دخول الدردشة</button>
    </div>

    <div class="header">
        <span id="app-title">💬 دردشة الأصدقاء السرية</span>
        <div class="status-container">
            <span id="user-count">📞 المتصلون: 1</span>
            <button class="call-btn" onclick="makeCall()">📞 اتصال نغمة</button>
        </div>
    </div>

    <!-- شريط الأصدقاء وإضافة صديق -->
    <div class="friends-bar">
        <button class="add-friend-btn" onclick="addFriend()">➕ إضافة صديق برمز</button>
        <div id="friends-list" style="display:flex; gap:8px;"></div>
    </div>

    <div class="chat-box" id="chat-box"></div>
    <div class="typing-indicator" id="typing-indicator"></div>

    <div class="footer">
        <input type="text" id="msg-input" class="input-field" placeholder="اكتب رسالة سرية..." oninput="handleTyping()">
        <button class="send-btn" onclick="sendMessage()">🚀</button>
    </div>

    <!-- النغمات الصوتية (تنبيهات مجانية سريعة الاستجابة من الإنترنت لسهولة التجربة) -->
    <audio id="msg-sound" src="https://mixkit.co" preload="auto"></audio>
    <audio id="ring-sound" src="https://mixkit.co" loop preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const userCount = document.getElementById('user-count');
        const typingIndicator = document.getElementById('typing-indicator');
        const loginScreen = document.getElementById('login-screen');
        const friendsList = document.getElementById('friends-list');
        
        let myUsername = "";
        let typingTimeout;

        function startApp() {
            const name = document.getElementById('username-input').value.trim();
            if (name) {
                myUsername = name;
                loginScreen.style.display = 'none';
                document.getElementById('app-title').innerText = `💬 حساب: ${myUsername}`;
                socket.emit('registerUser', myUsername);
            }
        }

        function addFriend() {
            const friendName = prompt("أدخل اسم الصديق (المستخدم) الذي تريد محادثته:");
            if (friendName) {
                const div = document.createElement('div');
                div.className = 'friend-tag';
                div.innerText = `👤 ${friendName}`;
                div.onclick = () => { msgInput.value = `@${friendName} `; msgInput.focus(); };
                friendsList.appendChild(div);
            }
        }

        socket.on('updateUserCount', (count) => { userCount.innerText = `📞 المتصلون: ${count}`; });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text) {
                socket.emit('chatMessage', { text, sender: myUsername });
                msgInput.value = '';
                socket.emit('typing', false);
            }
        }

        function handleTyping() {
            socket.emit('typing', { isTyping: true, user: myUsername });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { socket.emit('typing', { isTyping: false, user: myUsername }); }, 2000);
        }

        socket.on('typingStatus', (data) => {
            typingIndicator.innerText = data.isTyping ? `جاري الكتابة بواسطة ${data.user}...` : "";
        });

        function makeCall() {
            socket.emit('playRingToAll');
            alert("تم إرسال رنين الاتصال لجميع الأصدقاء!");
        }

        // استقبال رنين المكالمة وتشغيل النغمة المكررة
        socket.on('triggerRing', () => {
            document.getElementById('ring-sound').play();
            setTimeout(() => { document.getElementById('ring-sound').pause(); }, 6000); // يتوقف بعد 6 ثوانٍ
        });

        socket.on('chatMessage', (data) => {
            // تشغيل نغمة الرسالة المستلمة إذا كانت من شخص آخر
            if (data.sender !== myUsername) {
                document.getElementById('msg-sound').play();
            }

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', data.sender === myUsername ? 'sent' : 'received');
            msgDiv.innerHTML = `
                <div class="sender-name">${data.sender}</div>
                <div>${data.text}</div>
                <div class="time">${data.time} ✓✓</div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
